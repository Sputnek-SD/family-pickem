name: CI

on:
  pull_request:

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://yqbepfcgyzrvsicvxukb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_B9FtAXbv5ln6lS3P745C_Q__2SXk7vJ
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://yqbepfcgyzrvsicvxukb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_B9FtAXbv5ln6lS3P745C_Q__2SXk7vJ
      - run: node tests/smoke/boot.mjs
      - run: node tests/smoke/signin-race.mjs
      - run: node tests/smoke/raiders-cards.mjs
      - run: node tests/smoke/refresh-timeout.mjs
      - run: node tests/smoke/legacy-abort.mjs
      - run: node tests/smoke/history-align.mjs
      - run: node tests/smoke/week-fit.mjs
